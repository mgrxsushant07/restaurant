version: '3.9'

services:
  web:  # Name of the service (like a container)
    build: .  # Build the Docker image using the Dockerfile in the current directory
    ports:
      - "8001:8000"  # Map port 8001 on your VPS to port 8000 inside the container
    volumes:
      - .:/app  # Sync current folder (host) with /app folder inside the container (for live code changes) -- REMOVE for production
    environment:
      - DEBUG=False  # Disable Django's debug mode in production
      - ALLOWED_HOSTS=sushantgaha.com.np, 64.225.87.174  # Set allowed hosts for security
    command: ["gunicorn", "restaurant_menu.wsgi:application", "--bind", "0.0.0.0:8000"]
